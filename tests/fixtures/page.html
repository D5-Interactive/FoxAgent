<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>FoxAgent bridge fixture</title>
  <style>
    body { font: 16px/1.5 system-ui, sans-serif; padding: 20px; }
    #out, #submitted { color: #0a6; font-weight: 600; }
    #late { opacity: 0; }
  </style>
</head>
<body>
  <h1>Fixture page</h1>
  <p>This page exercises the content bridge: labels, shadow DOM, iframes, forms, waits.</p>

  <button id="go">Start task</button>
  <p id="out"></p>

  <button class="remove">Remove first</button>
  <button class="remove">Remove second</button>

  <form id="demo" onsubmit="event.preventDefault(); document.getElementById('submitted').textContent = 'yes';">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" placeholder="you@example.com">
    <label for="message">Message</label>
    <textarea id="message" name="message" placeholder="Write here"></textarea>
    <label for="color">Color</label>
    <select id="color" name="color">
      <option value="red">Red</option>
      <option value="green">Green</option>
    </select>
    <p id="submitted"></p>
  </form>

  <div id="hidden-modal" style="display:none">Hidden modal</div>
  <div id="shadow-host"></div>
  <iframe id="frame" srcdoc="<!doctype html><html><body style='font:14px sans-serif'>
    <label for='frame-field'>Frame label</label>
    <input id='frame-field' placeholder='Frame field'>
    <button id='frame-button'>Frame button</button>
  </body></html>"></iframe>

  <script src="page.js"></script>
</body>
</html>
